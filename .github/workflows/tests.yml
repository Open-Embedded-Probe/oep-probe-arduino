name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      esp32_core:
        # Build against another Arduino-ESP32 release (e.g. 3.3.13) without changing the repository: every sketch.yaml
        # is rewritten in the runner before the build. Empty keeps the pinned version.
        description: "Arduino-ESP32 core version to build with (empty = pinned)"
        required: false
        default: ""
      rp2040_core:
        description: "arduino-pico core version to build with (empty = pinned)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Run offline tests in the locked pytest workspace
        run: uv run --project tests --locked pytest -c tests/pyproject.toml tests/unit tests/portable

  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.matrix.outputs.builds }}
    steps:
      - uses: actions/checkout@v5
      - name: List every (example, profile) the release builds or checks
        id: matrix
        run: python3 tests/compile/test_profiles.py --matrix >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    name: ${{ matrix.name }} (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            !~/.arduino15/staging
          key: arduino15-${{ runner.os }}-${{ matrix.cache }}-${{ inputs.esp32_core }}-${{ inputs.rp2040_core }}
      - name: Use the requested core versions
        if: ${{ inputs.esp32_core != '' || inputs.rp2040_core != '' }}
        env:
          ESP32_CORE: ${{ inputs.esp32_core }}
          RP2040_CORE: ${{ inputs.rp2040_core }}
        run: |
          for v in "$ESP32_CORE" "$RP2040_CORE"; do
            if [ -n "$v" ] && ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "::error::a core version must look like 3.3.13 or 4.0.0-RC1, got '$v'"; exit 1
            fi
          done
          files=$(find examples tests -name sketch.yaml)
          [ -n "$ESP32_CORE" ] && sed -i -E "s/esp32:esp32 \([^)]*\)/esp32:esp32 ($ESP32_CORE)/" $files
          [ -n "$RP2040_CORE" ] && sed -i -E "s/rp2040:rp2040 \([^)]*\)/rp2040:rp2040 ($RP2040_CORE)/" $files
          grep -rhoE "(esp32:esp32|rp2040:rp2040) \([^)]*\)" $files | sort | uniq -c
          echo "Built with ESP32 ${ESP32_CORE:-pinned}, arduino-pico ${RP2040_CORE:-pinned} (the repository pins its own)." >> "$GITHUB_STEP_SUMMARY"
      - name: Update board and library indexes
        env:
          BOARD_INDEX_URLS: ${{ matrix.index_urls }}
        run: arduino-cli update --additional-urls "$BOARD_INDEX_URLS"
      - name: Build
        env:
          SKETCH: ${{ matrix.sketch }}
          PROFILE: ${{ matrix.profile }}
        run: arduino-cli compile --clean --warnings all --profile "$PROFILE" --output-dir build "$SKETCH"
      - name: Verify firmware identity
        if: matrix.release && startsWith(matrix.profile, 'esp32p4')
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 tools/check_p4_firmware.py build "$PROFILE"
