# Built firmware for every example, attached to the GitHub Release the shared Release workflow made.
#
# Not part of arduino-library-release-toolkit (release.yml and tools/bump_version.py stay as they are): this runs after
# it. A Release created with GITHUB_TOKEN starts no `release` event, so this follows the Release workflow's run
# (workflow_run) and finds the tag from the version it committed; workflow_dispatch rebuilds any tag by hand.
#
# Each example is built from the tag's sources with its sketch.yaml profile (the platform and libraries pinned there),
# `--clean`; the library itself is the tag's src/ (the release branch's sketch.yaml names it from the Library Manager,
# which may not have indexed the new version yet). Files: <Example>-<version>.merged.bin (ESP32: flash at 0x0 with
# esptool), <Example>-<version>.uf2 (RP2040 / RP2350), and firmware-<version>.json listing them with their sha256.
name: Firmware

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the default branch (the version the release committed)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find the tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            VERSION=$(sed -n 's/^version=//p' library.properties)
            TAG="v$VERSION"
          fi
          git fetch --tags --force
          git rev-parse "$TAG" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

      - name: Checkout the tag
        run: git checkout --quiet "${{ steps.tag.outputs.tag }}"

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Build every example
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess

          version = os.environ["VERSION"]
          lib = re.search(r"(?m)^name=(.+)$", pathlib.Path("library.properties").read_text()).group(1).strip()
          out = pathlib.Path("firmware")
          out.mkdir()
          files = []
          for yaml in sorted(pathlib.Path("examples").glob("*/sketch.yaml")):
              sketch = yaml.parent
              text = yaml.read_text()
              # the tag's own library sources, not the Library Manager's copy of this version
              yaml.write_text(re.sub(r"(?m)^(\s*)- " + re.escape(lib) + r" \([^)]*\)\s*$", r"\1- dir: ../..", text))
              profile = re.search(r"(?m)^default_profile:\s*(\S+)", text).group(1)
              build = pathlib.Path("build") / sketch.name
              subprocess.run(["arduino-cli", "compile", "--clean", "--profile", profile, "--output-dir", str(build),
                              str(sketch)], check=True)
              fqbn = re.search(r"(?m)^\s*fqbn:\s*(\S+)", text).group(1)
              made = []
              for suffix, kind in ((".ino.merged.bin", "merged.bin"), (".ino.uf2", "uf2")):
                  src = build / f"{sketch.name}{suffix}"
                  if src.exists():
                      dst = out / f"{sketch.name}-{version}.{kind}"
                      shutil.copy(src, dst)
                      made.append(dst)
              if not made:
                  raise SystemExit(f"{sketch.name}: no merged.bin or uf2 in {build}")
              for dst in made:
                  files.append({"example": sketch.name, "file": dst.name, "fqbn": fqbn,
                                "flash_offset": 0 if dst.suffix == ".bin" else None,
                                "sha256": hashlib.sha256(dst.read_bytes()).hexdigest()})
          (out / f"firmware-{version}.json").write_text(json.dumps(
              {"library": lib, "version": version, "firmware": files}, indent=2) + "\n")
          print("\n".join(f["file"] for f in files))
          PY

      - name: Attach to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" firmware/* --clobber
